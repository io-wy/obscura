name: Sandbox integration

on:
  workflow_dispatch:
    inputs:
      require_kvm:
        description: Require /dev/kvm on the runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sandbox-ci-setup
        with:
          require_kvm: ${{ inputs.require_kvm }}
      - name: Run smoke test
        run: make test-integration
      - name: Cleanup sandbox state
        if: always()
        run: make clean
