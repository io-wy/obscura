# Contract target: AgentENV v0.2.3 at commit
# 6cccaa7842bd5be2051111d4f74d9e37aa721244.
# Registry admission is pending real deployment smoke tests; this example is
# configuration documentation and is not currently an enabled backend.
apiVersion: sandbox.obscura.dev/v1alpha1
kind: SandboxRuntime
metadata:
  name: agentenv
  namespace: obscura-system
spec:
  config:
    type: agentenv
    apiVersion: v0.2.3
    controlEndpoint: http://agentenv-gateway.agentenv.svc.cluster.local
    dataEndpoint: http://agentenv-gateway.agentenv.svc.cluster.local
    apiKeySecretName: agentenv-key
  templates:
    dev: your-agentenv-template-id
---
apiVersion: sandbox.obscura.dev/v1alpha1
kind: Sandbox
metadata:
  name: agentenv-demo
  namespace: obscura-system
spec:
  runtimeRef: agentenv
  templateRef: dev
  # This API takes its resource size from the backend template.
  network:
    allowEgress: true
  timeoutSeconds: 300
