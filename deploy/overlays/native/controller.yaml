# Label exactly one Linux node obscura.dev/runtime-node=true. Both components
# must reach the SAME runtime database/socket; do not use this for multi-node HA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obscura-controller
spec:
  template:
    spec:
      nodeSelector:
        obscura.dev/runtime-node: 'true'
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      volumes:
        - name: runtime-socket
          hostPath:
            path: /run/obscura
            type: Directory
      containers:
        - name: controller
          volumeMounts:
            - name: runtime-socket
              mountPath: /run/obscura
              readOnly: true
