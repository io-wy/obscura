[package]
name = "agentruntime-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
prost = "0.14.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"
